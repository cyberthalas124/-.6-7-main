<audio id="bookAudio" autoplay loop src="Dr._Dog_-_Whered_All_the_Time_Go_(mp3.pm).mp3"></audio>
<button id="audioToggle" type="button" aria-label="Pause music">⏸</button>

<script>
  const audio = document.getElementById('bookAudio');
  const toggle = document.getElementById('audioToggle');

  toggle.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      toggle.textContent = '⏸';
      toggle.setAttribute('aria-label', 'Pause music');
    } else {
      audio.pause();
      toggle.textContent = '▶';
      toggle.setAttribute('aria-label', 'Play music');
    }
  });
</script>
